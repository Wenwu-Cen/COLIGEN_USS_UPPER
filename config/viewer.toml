[can]
# 原有 CAN / CS+ 属于 20 探头方案；TRACE32 在界面独立选择 17 / 20。
# ZLG 型号：100U=42、200U=41、400U=76、800U=59。
# 界面可选硬件索引 0..99、通道索引 0..7，实际通道数取决于设备型号。
device_type = 41
device_index = 0
channel = 0
bitrate = 500000
data_bitrate = 2000000
resistance = true

[canoe]
# 界面 CAN1..CAN10 对应此处 Vector 应用通道索引 0..9。
# app_name 使用 Vector Hardware Configuration 中 CANoe 应用的通道映射。
channel = 0
app_name = "CANoe"
bitrate = 500000
data_bitrate = 2000000
fd = true
listen_only = false

[tosun]
# TC1018 物理 CAN1..CAN12 对应 SDK 通道 0..11，独立于 Vector CANoe 映射。
channel = 0
# 留空连接首个可用设备；多设备时填写序列号。
serial = ""
bitrate = 500000
data_bitrate = 2000000
fd = true
resistance = true
listen_only = false

[replay]
# GUI 选择 ASC/BLF 后会覆盖此路径；直接运行时以它作为默认文件。
path = ""
# 0 = 最快，1 = 原始时序，2 = 两倍速。
speed = 1.0
# 标准 TOML 必须写小写 false；播完停在最后一帧，可用进度条拖动定位。
loop = false
# -1 表示不过滤通道；ASC 常见通道号从 1 开始，BLF/python-can 常从 0 开始。
channel = -1

[ethernet]
# 新增以太网属于 17 探头方案，字段数量严格遵循底软外发结构。
# RTE 回读 uss_vendor_sdk.h 中标识 1～5 的完整 512 字节数据包。
# udp 为本机监听，tcp 为连接 RTE 服务端。IP 和端口需与 RTE 转发配置一致。
transport = "udp"
listen_host = "0.0.0.0"
remote_host = "127.0.0.1"
port = 50000
byte_order = "little"
# 默认 C 自然对齐。底软若使用 pragma pack，可改为 1、2 或 4。
alignment = 8
# 每个 UDP 数据报 / TCP 固定帧在 512 字节负载之前的前缀长度。
payload_offset = 0
timeout = 1.0
