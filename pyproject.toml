[project]
name = "coligen-uss-upper"
version = "5.4.2"
description = "COLIGEN USS UPPER with CAN, Ethernet, UART and replay sources"
requires-python = ">=3.10,<3.13"
dependencies = [
    "python-can==4.6.1",
    "pyserial==3.5",
    "cantools==44.0.0",
    "numpy==2.2.6",
    "lauterbach-trace32-rcl==1.0.8",
    "customtkinter==6.0.0",
    "pyelftools==0.33",
]

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "pytest==8.4.2",
    "ruff==0.13.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
